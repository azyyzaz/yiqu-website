<!doctype html>
<!--
  部署提示：
  本页样式已全部内联，不依赖外部文件，因此在任何路径下都能正常渲染。
  唯一需要确认的是 data-base —— 它决定"返回首页"指向哪里：

    · 绑定自定义域名（如 https://www.yiquwl.com/）   → data-base="/"          （默认，无需改动）
    · 部署在 https://<用户名>.github.io/             → data-base="/"
    · 部署在 https://<用户名>.github.io/<仓库名>/    → data-base="/<仓库名>/"  （需修改）
-->
<html lang="zh-CN" data-base="/">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 — 福州易趣网络科技有限公司</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --ink: #0d1117;
    --ink-2: #4b5563;
    --accent: #2c55f0;
    --accent-hover: #1f41cc;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC",
                 "Noto Sans CJK SC", "Helvetica Neue", Arial, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: #fff;
    color: var(--ink);
    font-family: var(--font-sans);
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  .err {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 40px 24px;
    text-align: center;
  }
  .err-code {
    margin: 0 0 22px;
    font-size: clamp(64px, 14vw, 128px);
    font-weight: 600;
    line-height: 1;
    letter-spacing: -.04em;
    background: linear-gradient(100deg, #2c55f0 12%, #6d8bff 92%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .err h1 {
    margin: 0 0 14px;
    font-size: clamp(1.25rem, 3vw, 1.75rem);
    font-weight: 600;
    letter-spacing: -.01em;
  }
  .err p {
    max-width: 460px;
    margin: 0 0 34px;
    color: var(--ink-2);
    line-height: 1.9;
  }
  .err-btn {
    display: inline-flex;
    align-items: center;
    padding: 13px 30px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
    transition: background-color .18s ease;
  }
  .err-btn:hover { background: var(--accent-hover); }
  .err-meta {
    margin-top: 46px;
    font-size: 13px;
    color: #8b94a3;
  }
</style>
</head>
<body>
  <main class="err">
    <p class="err-code">404</p>
    <h1>页面不存在</h1>
    <p>您访问的页面可能已被移动或删除。<br>请返回首页，或通过邮件与我们联系。</p>
    <a class="err-btn" id="homeLink" href="/">返回首页</a>
    <p class="err-meta">福州易趣网络科技有限公司</p>
  </main>

  <script>
    // 按 data-base 修正"返回首页"的指向，兼容 GitHub Pages 子路径部署
    (function () {
      var base = document.documentElement.getAttribute('data-base') || '/';
      if (base.charAt(0) !== '/') base = '/' + base;
      if (base.slice(-1) !== '/') base += '/';
      document.getElementById('homeLink').setAttribute('href', base);
      var icon = document.querySelector('link[rel="icon"]');
      if (icon) icon.setAttribute('href', base + 'assets/favicon.svg');
    })();
  </script>
</body>
</html>
